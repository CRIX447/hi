<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic World · AI · Chat · Phones · Landscape</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e17;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: relative;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .hud-top {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .hud-title {
            font-size: 17px;
            font-weight: 500;
            background: linear-gradient(135deg, #c8d6e5, #8395a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hud-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #a0b4c8;
        }
        .hud-stats .num {
            color: #eef5ff;
            font-weight: 500;
        }
        .hud-datetime {
            font-size: 12px;
            color: #b0c8e0;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 20px;
        }
        .hud-weather {
            font-size: 12px;
            color: #b0c8e0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Controls */
        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 8px 14px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(10, 14, 26, 0.8);
            backdrop-filter: blur(14px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        .controls-panel .ctrl-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .controls-panel label {
            font-size: 11px;
            color: #8fa4bc;
        }
        .controls-panel input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, #2a3a55, #5b7f9e);
            outline: none;
            cursor: pointer;
        }
        .controls-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7eb6d9, #3f6a8c);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }
        .controls-panel .val {
            font-size: 11px;
            color: #d6e3f0;
            min-width: 24px;
            text-align: center;
        }
        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c8dae9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            pointer-events: auto;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d4b6b, #1d334a);
            border-color: rgba(94, 159, 209, 0.25);
            color: #d6eaff;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #3a5f82, #25415e);
        }
        .badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #7a96b0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        .badge .dot.green {
            background: #5ad0a0;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Crime overlay */
        .crime-overlay {
            position: absolute;
            bottom: 80px;
            right: 16px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 11px;
            color: #c8dae9;
            min-width: 130px;
            pointer-events: none;
            display: none;
        }
        .crime-overlay.visible {
            display: block;
        }
        .crime-overlay .title {
            font-weight: 500;
            margin-bottom: 3px;
            color: #d6e3f0;
        }
        .crime-overlay .zone {
            display: flex;
            justify-content: space-between;
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .crime-overlay .zone .rate {
            font-weight: 400;
        }
        .crime-overlay .legend {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            font-size: 9px;
            color: #8fa4bc;
        }
        .crime-overlay .legend .color {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* Chat log panel */
        .chat-log {
            position: absolute;
            bottom: 80px;
            left: 16px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 12px;
            max-width: 320px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
            color: #c8dae9;
            pointer-events: none;
            display: none;
            scrollbar-width: thin;
            scrollbar-color: #3a4a6a transparent;
        }
        .chat-log.visible {
            display: block;
        }
        .chat-log::-webkit-scrollbar {
            width: 4px;
        }
        .chat-log::-webkit-scrollbar-thumb {
            background: #3a4a6a;
            border-radius: 10px;
        }
        .chat-log .entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 6px;
        }
        .chat-log .entry .time {
            color: #6a8a9a;
            min-width: 40px;
            font-size: 9px;
        }
        .chat-log .entry .msg {
            color: #d6e3f0;
            word-break: break-word;
        }
        .chat-log .entry .phone {
            color: #7ad0a0;
        }

        .hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 12px;
            border-radius: 30px;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            .hud-top {
                padding: 4px 10px;
                gap: 4px;
            }
            .hud-title {
                font-size: 14px;
            }
            .hud-stats {
                font-size: 10px;
                gap: 6px;
            }
            .controls-panel {
                padding: 4px 10px;
                gap: 4px 8px;
                bottom: 10px;
                border-radius: 28px;
                flex-wrap: wrap;
            }
            .controls-panel input[type="range"] {
                width: 40px;
            }
            .btn {
                font-size: 10px;
                padding: 3px 8px;
            }
            .badge {
                font-size: 9px;
                padding: 2px 6px;
            }
            .hud-datetime {
                font-size: 10px;
            }
            .hud-weather {
                font-size: 10px;
            }
            .crime-overlay {
                bottom: 70px;
                right: 8px;
                font-size: 10px;
                padding: 6px 8px;
                min-width: 100px;
            }
            .chat-log {
                bottom: 70px;
                left: 8px;
                max-width: 200px;
                max-height: 120px;
                font-size: 10px;
                padding: 4px 8px;
            }
            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- HUD -->
        <div class="hud">
            <div class="hud-top">
                <div class="hud-title">🌍 WorldSim</div>
                <div class="hud-stats">
                    <span>👤 <span class="num" id="peopleCount">0</span></span>
                    <span>🚗 <span class="num" id="carCount">0</span></span>
                    <span>🚤 <span class="num" id="boatCount">0</span></span>
                    <span>✈️ <span class="num" id="planeCount">0</span></span>
                </div>
                <div class="hud-datetime" id="datetimeDisplay">Day 1, 08:00</div>
                <div class="hud-weather" id="weatherDisplay">☀️ Clear</div>
            </div>
        </div>

        <!-- Crime overlay -->
        <div class="crime-overlay" id="crimeOverlay">
            <div class="title">🚨 Crime Rate by Zone</div>
            <div id="crimeList"></div>
            <div class="legend">
                <span><span class="color" style="background:#22aa44;"></span> Low</span>
                <span><span class="color" style="background:#ffaa33;"></span> Medium</span>
                <span><span class="color" style="background:#dd3333;"></span> High</span>
            </div>
        </div>

        <!-- Chat log -->
        <div class="chat-log" id="chatLog">
            <div id="chatEntries"></div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            <div class="ctrl-group">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="0" max="300" value="100" step="1" />
                <span class="val" id="speedValue">1.0×</span>
            </div>
            <button class="btn btn-primary" id="playBtn"><span style="font-size:14px;">⏸</span> Pause</button>
            <button class="btn" id="resetBtn"><span style="font-size:14px;">↺</span> Reset</button>
            <button class="btn" id="crimeToggleBtn">📊 Crime</button>
            <button class="btn" id="chatToggleBtn">💬 Chat</button>
            <div class="badge"><span class="dot green"></span> <span id="statusText">AI alive</span></div>
        </div>

        <div class="hint">WASD move · Drag look · Scroll zoom · C crime · L chat</div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  REALISTIC WORLD SIMULATION  —  AI · CHAT · PHONES · LANDSCAPE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ── DOM ──
        const container = document.getElementById('canvas-container');
        const peopleCountEl = document.getElementById('peopleCount');
        const carCountEl = document.getElementById('carCount');
        const boatCountEl = document.getElementById('boatCount');
        const planeCountEl = document.getElementById('planeCount');
        const datetimeDisplay = document.getElementById('datetimeDisplay');
        const weatherDisplay = document.getElementById('weatherDisplay');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const crimeToggleBtn = document.getElementById('crimeToggleBtn');
        const crimeOverlay = document.getElementById('crimeOverlay');
        const crimeList = document.getElementById('crimeList');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatLog = document.getElementById('chatLog');
        const chatEntries = document.getElementById('chatEntries');
        const statusText = document.getElementById('statusText');

        // ── Three.js ──
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 300, 500);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 600);
        camera.position.set(80, 50, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        labelRenderer.domElement.style.zIndex = '10';
        container.appendChild(labelRenderer.domElement);

        // ── Freecam with WASD ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.05;
        controls.minDistance = 3;
        controls.maxDistance = 400;
        controls.target.set(0, 2, 0);

        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'a' || k === 's' || k === 'd') keys[k] = true;
            if (k === 'c') toggleCrimeOverlay();
            if (k === 'l') toggleChatLog();
        });
        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'a' || k === 's' || k === 'd') keys[k] = false;
        });

        function updateCameraMovement(dt) {
            const speed = 40 * dt;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
            const move = new THREE.Vector3();
            if (keys.w) move.add(forward);
            if (keys.s) move.sub(forward);
            if (keys.a) move.sub(right);
            if (keys.d) move.add(right);
            if (move.length() > 0) {
                move.normalize().multiplyScalar(speed);
                camera.position.add(move);
                controls.target.add(move);
            }
        }

        // ── Lighting ──
        const ambientLight = new THREE.AmbientLight(0x8899bb, 0.5);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        sunLight.position.set(60, 80, 40);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 300;
        sunLight.shadow.camera.left = -150;
        sunLight.shadow.camera.right = 150;
        sunLight.shadow.camera.top = 150;
        sunLight.shadow.camera.bottom = -150;
        scene.add(sunLight);
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-40, 20, -30);
        scene.add(fillLight);
        const hemiLight = new THREE.HemisphereLight(0x88aacc, 0x223344, 0.6);
        scene.add(hemiLight);

        // ── World configuration ──
        const WORLD_SIZE = 600;
        const HALF = WORLD_SIZE / 2;

        // ── Zone system (realistic placement) ──
        const ZONES = {
            DOWNTOWN: 'downtown',
            SUBURBAN: 'suburban',
            AIRPORT: 'airport',
            HARBOR: 'harbor',
            BEACH: 'beach',
            COUNTRYSIDE: 'countryside',
            FARM: 'farm',
            FOREST: 'forest',
            LAKE: 'lake',
            OCEAN: 'ocean',
            PARK: 'park',
            TOWN: 'town' // countryside town
        };

        let zoneData = [];

        function generateZones() {
            // Ocean: south
            zoneData.push({ x: -250, z: 200, w: 500, h: 150, type: ZONES.OCEAN, name: 'Ocean' });
            // Beach: between ocean and city
            zoneData.push({ x: -120, z: 160, w: 240, h: 40, type: ZONES.BEACH, name: 'Beach' });
            // Harbor: south-east of city
            zoneData.push({ x: 80, z: 150, w: 60, h: 50, type: ZONES.HARBOR, name: 'Harbor' });
            // Downtown: central
            zoneData.push({ x: -40, z: -40, w: 80, h: 80, type: ZONES.DOWNTOWN, name: 'Downtown' });
            // Park in downtown
            zoneData.push({ x: -10, z: -10, w: 20, h: 20, type: ZONES.PARK, name: 'Central Park' });
            // Suburbs around downtown
            zoneData.push({ x: -100, z: -80, w: 60, h: 60, type: ZONES.SUBURBAN, name: 'Suburb NW' });
            zoneData.push({ x: 40, z: -80, w: 60, h: 60, type: ZONES.SUBURBAN, name: 'Suburb NE' });
            zoneData.push({ x: -100, z: 20, w: 60, h: 60, type: ZONES.SUBURBAN, name: 'Suburb SW' });
            zoneData.push({ x: 40, z: 20, w: 60, h: 60, type: ZONES.SUBURBAN, name: 'Suburb SE' });
            // Airport: east
            zoneData.push({ x: 160, z: -20, w: 60, h: 40, type: ZONES.AIRPORT, name: 'Airport' });
            // Countryside: north and west
            zoneData.push({ x: -200, z: -120, w: 100, h: 80, type: ZONES.COUNTRYSIDE, name: 'Countryside NW' });
            zoneData.push({ x: -200, z: -30, w: 80, h: 60, type: ZONES.COUNTRYSIDE, name: 'Countryside SW' });
            zoneData.push({ x: 100, z: -120, w: 100, h: 80, type: ZONES.COUNTRYSIDE, name: 'Countryside NE' });
            zoneData.push({ x: 160, z: 30, w: 60, h: 60, type: ZONES.COUNTRYSIDE, name: 'Countryside SE' });
            // Farms in countryside
            zoneData.push({ x: -180, z: -100, w: 40, h: 30, type: ZONES.FARM, name: 'Farm 1' });
            zoneData.push({ x: 120, z: -100, w: 40, h: 30, type: ZONES.FARM, name: 'Farm 2' });
            zoneData.push({ x: -180, z: -30, w: 30, h: 30, type: ZONES.FARM, name: 'Farm 3' });
            // Countryside towns (small clusters)
            zoneData.push({ x: -140, z: 80, w: 25, h: 25, type: ZONES.TOWN, name: 'Country Town 1' });
            zoneData.push({ x: 140, z: 60, w: 25, h: 25, type: ZONES.TOWN, name: 'Country Town 2' });
            // Forest
            zoneData.push({ x: -200, z: 30, w: 40, h: 40, type: ZONES.FOREST, name: 'Forest' });
            // Lake
            zoneData.push({ x: 120, z: 120, w: 30, h: 25, type: ZONES.LAKE, name: 'Lake' });
        }
        generateZones();

        // ── Crime rates ──
        let crimeRates = {};

        function computeCrimeRates() {
            for (const zone of zoneData) {
                let rate = 0.05;
                if (zone.type === ZONES.DOWNTOWN) rate += 0.25;
                else if (zone.type === ZONES.SUBURBAN) rate += 0.10;
                else if (zone.type === ZONES.AIRPORT || zone.type === ZONES.HARBOR) rate += 0.15;
                else if (zone.type === ZONES.COUNTRYSIDE || zone.type === ZONES.FARM || zone.type === ZONES.FOREST || zone
                    .type === ZONES.TOWN) rate -= 0.02;
                else if (zone.type === ZONES.BEACH) rate += 0.08;
                rate += (Math.random() - 0.5) * 0.04;
                rate = clamp(rate, 0.01, 0.8);
                crimeRates[zone.name] = rate;
            }
        }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        computeCrimeRates();

        // ── Chat log ──
        const chatMessages = [];
        let chatLogVisible = false;

        function addChatMessage(speaker, message, isPhone = false) {
            const time = new Date();
            const timeStr = `${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
            chatMessages.push({ time: timeStr, speaker, message, isPhone });
            if (chatMessages.length > 50) chatMessages.shift();
            renderChatLog();
        }

        function renderChatLog() {
            chatEntries.innerHTML = '';
            for (const entry of chatMessages) {
                const div = document.createElement('div');
                div.className = 'entry';
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = entry.time;
                const msgSpan = document.createElement('span');
                msgSpan.className = 'msg';
                if (entry.isPhone) {
                    msgSpan.innerHTML = `<span class="phone">📞 ${entry.speaker}:</span> ${entry.message}`;
                } else {
                    msgSpan.textContent = `${entry.speaker}: ${entry.message}`;
                }
                div.appendChild(timeSpan);
                div.appendChild(msgSpan);
                chatEntries.appendChild(div);
            }
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function toggleChatLog() {
            chatLogVisible = !chatLogVisible;
            chatLog.classList.toggle('visible', chatLogVisible);
        }

        // ── Build world geometry ──
        const buildingMeshes = [];
        const treeMeshes = [];
        const waterMeshes = [];

        function buildWorld() {
            // Ground
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a5a3a, roughness: 0.9 });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE), groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, -0.05, 0);
            ground.receiveShadow = true;
            scene.add(ground);

            // For each zone
            for (const zone of zoneData) {
                const cx = zone.x + zone.w / 2;
                const cz = zone.z + zone.h / 2;
                const w = zone.w;
                const h = zone.h;

                if (zone.type === ZONES.OCEAN) {
                    const waterMat = new THREE.MeshStandardMaterial({
                        color: 0x1a5a8a,
                        roughness: 0.2,
                        metalness: 0.3,
                        transparent: true,
                        opacity: 0.7,
                    });
                    const water = new THREE.Mesh(new THREE.PlaneGeometry(w, h), waterMat);
                    water.rotation.x = -Math.PI / 2;
                    water.position.set(cx, 0.0, cz);
                    scene.add(water);
                    waterMeshes.push(water);
                    continue;
                }

                if (zone.type === ZONES.BEACH) {
                    const sandMat = new THREE.MeshStandardMaterial({ color: 0xd4b48c, roughness: 0.9 });
                    const sand = new THREE.Mesh(new THREE.PlaneGeometry(w, h), sandMat);
                    sand.rotation.x = -Math.PI / 2;
                    sand.position.set(cx, 0.01, cz);
                    sand.receiveShadow = true;
                    scene.add(sand);
                    for (let i = 0; i < 10; i++) {
                        const tx = zone.x + 2 + Math.random() * (w - 4);
                        const tz = zone.z + 2 + Math.random() * (h - 4);
                        const tree = createTree(0.6, true);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    continue;
                }

                if (zone.type === ZONES.LAKE) {
                    const waterMat = new THREE.MeshStandardMaterial({
                        color: 0x1a6a8a,
                        roughness: 0.3,
                        metalness: 0.2,
                        transparent: true,
                        opacity: 0.6,
                    });
                    const water = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, h * 0.9), waterMat);
                    water.rotation.x = -Math.PI / 2;
                    water.position.set(cx, 0.02, cz);
                    scene.add(water);
                    waterMeshes.push(water);
                    continue;
                }

                if (zone.type === ZONES.FOREST) {
                    for (let i = 0; i < 50; i++) {
                        const tx = zone.x + Math.random() * w;
                        const tz = zone.z + Math.random() * h;
                        const tree = createTree(0.4 + Math.random() * 0.6, false);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    continue;
                }

                if (zone.type === ZONES.FARM) {
                    const fieldMat = new THREE.MeshStandardMaterial({ color: 0x8a7a4a, roughness: 0.9 });
                    const field = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.8, h * 0.8), fieldMat);
                    field.rotation.x = -Math.PI / 2;
                    field.position.set(cx, 0.01, cz);
                    field.receiveShadow = true;
                    scene.add(field);
                    for (let i = 0; i < 3; i++) {
                        const bx = zone.x + 2 + Math.random() * (w - 4);
                        const bz = zone.z + 2 + Math.random() * (h - 4);
                        const barn = new THREE.Mesh(
                            new THREE.BoxGeometry(0.8, 0.5, 1.2),
                            new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.8 })
                        );
                        barn.position.set(bx, 0.25, bz);
                        barn.castShadow = true;
                        barn.receiveShadow = true;
                        scene.add(barn);
                        buildingMeshes.push(barn);
                    }
                    continue;
                }

                if (zone.type === ZONES.TOWN) {
                    // Small town buildings
                    for (let i = 0; i < 8; i++) {
                        const bx = zone.x + 1 + Math.random() * (w - 2);
                        const bz = zone.z + 1 + Math.random() * (h - 2);
                        const bw = 0.5 + Math.random() * 0.6;
                        const bd = 0.5 + Math.random() * 0.6;
                        const bh = 0.5 + Math.random() * 0.8;
                        const col = new THREE.Color().setHSL(0.08 + Math.random() * 0.1, 0.4, 0.5 + Math.random() * 0.2);
                        const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
                        const building = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
                        building.position.set(bx, bh / 2, bz);
                        building.castShadow = true;
                        building.receiveShadow = true;
                        scene.add(building);
                        buildingMeshes.push(building);
                    }
                    // Some trees
                    for (let i = 0; i < 6; i++) {
                        const tx = zone.x + 1 + Math.random() * (w - 2);
                        const tz = zone.z + 1 + Math.random() * (h - 2);
                        const tree = createTree(0.3 + Math.random() * 0.4, false);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    continue;
                }

                if (zone.type === ZONES.AIRPORT) {
                    const runwayMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.7 });
                    const runway = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, h * 0.5), runwayMat);
                    runway.rotation.x = -Math.PI / 2;
                    runway.position.set(cx, 0.01, cz);
                    runway.receiveShadow = true;
                    scene.add(runway);
                    const termMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.5 });
                    const term = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 2), termMat);
                    term.position.set(cx - 2, 0.75, cz);
                    term.castShadow = true;
                    term.receiveShadow = true;
                    scene.add(term);
                    buildingMeshes.push(term);
                    continue;
                }

                if (zone.type === ZONES.HARBOR) {
                    const dockMat = new THREE.MeshStandardMaterial({ color: 0x6a6a5a, roughness: 0.8 });
                    for (let i = 0; i < 4; i++) {
                        const dock = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 4), dockMat);
                        dock.position.set(cx - 2.5 + i * 2.5, 0.1, cz + 1);
                        dock.receiveShadow = true;
                        scene.add(dock);
                        buildingMeshes.push(dock);
                    }
                    const whMat = new THREE.MeshStandardMaterial({ color: 0x7a7a6a, roughness: 0.7 });
                    for (let i = 0; i < 3; i++) {
                        const wh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), whMat);
                        wh.position.set(cx - 3 + i * 3.5, 0.5, cz - 1.5);
                        wh.castShadow = true;
                        wh.receiveShadow = true;
                        scene.add(wh);
                        buildingMeshes.push(wh);
                    }
                    continue;
                }

                if (zone.type === ZONES.DOWNTOWN) {
                    const colors = [0x6a7a9a, 0x7a8aaa, 0x5a6a8a, 0x8a9aba, 0x9aaaca];
                    for (let i = 0; i < 30; i++) {
                        const bx = zone.x + 1 + Math.random() * (w - 2);
                        const bz = zone.z + 1 + Math.random() * (h - 2);
                        if (bx > -5 && bx < 5 && bz > -5 && bz < 5) continue;
                        const bw = 0.4 + Math.random() * 0.8;
                        const bd = 0.4 + Math.random() * 0.8;
                        const bh = 1.5 + Math.random() * 4.0;
                        const col = colors[Math.floor(Math.random() * colors.length)];
                        const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, metalness: 0.1 });
                        const building = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), mat);
                        building.position.set(bx, bh / 2, bz);
                        building.castShadow = true;
                        building.receiveShadow = true;
                        scene.add(building);
                        buildingMeshes.push(building);
                    }
                    // Special buildings with labels
                    const specials = [
                        { name: 'Town Hall', color: 0xccbbaa, w: 1.2, d: 1.2, h: 1.8, x: -5, z: -5 },
                        { name: 'Police', color: 0x446688, w: 1.0, d: 1.0, h: 1.2, x: -8, z: 2 },
                        { name: 'Hospital', color: 0xee8888, w: 1.5, d: 1.0, h: 1.5, x: 5, z: -6 },
                        { name: 'Fire Station', color: 0xcc5533, w: 1.2, d: 0.8, h: 1.0, x: 6, z: 4 },
                        { name: 'Post Office', color: 0x88aa88, w: 0.8, d: 0.8, h: 0.8, x: -6, z: 6 },
                        { name: 'Mall', color: 0x99aacc, w: 2.0, d: 1.5, h: 1.2, x: -10, z: -8 },
                        { name: 'Bank', color: 0x88aacc, w: 0.8, d: 0.8, h: 1.0, x: -2, z: -9 },
                        { name: 'Restaurant', color: 0xcc8866, w: 0.6, d: 0.6, h: 0.6, x: 2, z: 8 },
                        { name: 'Auto Shop', color: 0x666677, w: 0.8, d: 0.8, h: 0.6, x: 8, z: -8 },
                    ];
                    for (const sp of specials) {
                        const mat = new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.5, metalness: 0.1 });
                        const building = new THREE.Mesh(new THREE.BoxGeometry(sp.w, sp.h, sp.d), mat);
                        building.position.set(sp.x, sp.h / 2, sp.z);
                        building.castShadow = true;
                        building.receiveShadow = true;
                        scene.add(building);
                        buildingMeshes.push(building);
                        const labelDiv = document.createElement('div');
                        labelDiv.textContent = sp.name;
                        labelDiv.style.color = '#c8dae9';
                        labelDiv.style.fontSize = '10px';
                        labelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
                        labelDiv.style.background = 'rgba(0,0,0,0.4)';
                        labelDiv.style.padding = '2px 8px';
                        labelDiv.style.borderRadius = '12px';
                        labelDiv.style.backdropFilter = 'blur(4px)';
                        labelDiv.style.border = '1px solid rgba(255,255,255,0.05)';
                        labelDiv.style.pointerEvents = 'none';
                        const label = new CSS2DObject(labelDiv);
                        label.position.set(sp.x, sp.h + 0.3, sp.z);
                        scene.add(label);
                    }
                    // Park
                    const parkMat = new THREE.MeshStandardMaterial({ color: 0x3a8a4a, roughness: 0.9 });
                    const park = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), parkMat);
                    park.rotation.x = -Math.PI / 2;
                    park.position.set(0, 0.02, 0);
                    park.receiveShadow = true;
                    scene.add(park);
                    for (let i = 0; i < 10; i++) {
                        const tx = -2.5 + Math.random() * 5;
                        const tz = -2.5 + Math.random() * 5;
                        const tree = createTree(0.5, false);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    // Roads
                    const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.8 });
                    for (let i = -12; i <= 12; i += 3) {
                        if (Math.abs(i) < 1) continue;
                        const r1 = new THREE.Mesh(new THREE.PlaneGeometry(30, 0.3), roadMat);
                        r1.rotation.x = -Math.PI / 2;
                        r1.position.set(0, 0.02, i);
                        scene.add(r1);
                        const r2 = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 30), roadMat);
                        r2.rotation.x = -Math.PI / 2;
                        r2.position.set(i, 0.02, 0);
                        scene.add(r2);
                    }
                    continue;
                }

                if (zone.type === ZONES.SUBURBAN) {
                    const houseMat = new THREE.MeshStandardMaterial({ color: 0x8a9a8a, roughness: 0.7 });
                    const roofMat = new THREE.MeshStandardMaterial({ color: 0x6a4a3a, roughness: 0.8 });
                    for (let i = 0; i < 15; i++) {
                        const bx = zone.x + 1 + Math.random() * (w - 2);
                        const bz = zone.z + 1 + Math.random() * (h - 2);
                        const bw = 0.5 + Math.random() * 0.4;
                        const bd = 0.5 + Math.random() * 0.4;
                        const bh = 0.4 + Math.random() * 0.3;
                        const house = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), houseMat);
                        house.position.set(bx, bh / 2, bz);
                        house.castShadow = true;
                        house.receiveShadow = true;
                        scene.add(house);
                        buildingMeshes.push(house);
                        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.4, 4), roofMat);
                        roof.position.set(bx, bh + 0.2, bz);
                        roof.rotation.y = Math.PI / 4;
                        roof.castShadow = true;
                        scene.add(roof);
                        buildingMeshes.push(roof);
                    }
                    for (let i = 0; i < 10; i++) {
                        const tx = zone.x + 1 + Math.random() * (w - 2);
                        const tz = zone.z + 1 + Math.random() * (h - 2);
                        const tree = createTree(0.3 + Math.random() * 0.4, false);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    continue;
                }

                if (zone.type === ZONES.COUNTRYSIDE) {
                    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a7a4a, roughness: 0.9 });
                    const grass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), grassMat);
                    grass.rotation.x = -Math.PI / 2;
                    grass.position.set(cx, 0.01, cz);
                    grass.receiveShadow = true;
                    scene.add(grass);
                    for (let i = 0; i < 12; i++) {
                        const tx = zone.x + 2 + Math.random() * (w - 4);
                        const tz = zone.z + 2 + Math.random() * (h - 4);
                        const tree = createTree(0.5 + Math.random() * 0.8, false);
                        tree.position.set(tx, 0, tz);
                        scene.add(tree);
                        treeMeshes.push(tree);
                    }
                    continue;
                }
            }
        }

        function createTree(scale = 1, palm = false) {
            const group = new THREE.Group();
            if (palm) {
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, roughness: 0.9 });
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05 * scale, 0.08 * scale, 0.6 * scale, 5), trunkMat);
                trunk.position.y = 0.3 * scale;
                group.add(trunk);
                const crownMat = new THREE.MeshStandardMaterial({ color: 0x3a8a3a, roughness: 0.7 });
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.3 * scale, 0.2 * scale, 5), crownMat);
                crown.position.y = 0.7 * scale;
                group.add(crown);
                for (let i = 0; i < 5; i++) {
                    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.3 * scale, 0.1 * scale), crownMat);
                    leaf.position.set(0, 0.7 * scale, 0);
                    leaf.rotation.y = i * Math.PI * 2 / 5;
                    leaf.rotation.x = 0.4;
                    group.add(leaf);
                }
            } else {
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.9 });
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.04 * scale, 0.06 * scale, 0.5 * scale, 5), trunkMat);
                trunk.position.y = 0.25 * scale;
                group.add(trunk);
                const crownMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.28 + Math.random() * 0.08, 0.5, 0.3 + Math.random() * 0.15),
                    roughness: 0.8,
                });
                const crown = new THREE.Mesh(new THREE.SphereGeometry(0.3 * scale, 5, 5), crownMat);
                crown.position.y = 0.6 * scale + Math.random() * 0.2 * scale;
                group.add(crown);
            }
            group.castShadow = true;
            group.receiveShadow = true;
            return group;
        }

        buildWorld();

        // ── AI Agents ──
        let people = [];
        let cars = [];
        let boats = [];
        let planes = [];

        // ── Person class ──
        class Person {
            constructor(zone) {
                this.zone = zone;
                this.x = zone.x + Math.random() * zone.w;
                this.z = zone.z + Math.random() * zone.h;
                this.radius = 0.2;
                this.speed = 0.5 + Math.random() * 0.8;
                this.state = 'walking';
                this.angle = Math.random() * Math.PI * 2;
                this.color = new THREE.Color().setHSL(Math.random(), 0.6, 0.55);
                this.group = new THREE.Group();
                // body
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.7 });
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.35, 6), bodyMat);
                body.position.y = 0.25;
                body.castShadow = true;
                this.group.add(body);
                // head
                const headMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.07, 0.3, 0.55),
                    roughness: 0.6
                });
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), headMat);
                head.position.y = 0.45;
                head.castShadow = true;
                this.group.add(head);
                // legs
                const legMat = new THREE.MeshStandardMaterial({ color: 0x334466, roughness: 0.8 });
                for (let s = -1; s <= 1; s += 2) {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.2, 4), legMat);
                    leg.position.set(s * 0.05, 0.1, 0);
                    this.group.add(leg);
                }
                scene.add(this.group);
                this.updatePosition();
                this.target = this.pickTarget();
                this.walkTimer = Math.random() * 4 + 2;
                this.stateTimer = 0;
                this.activity = this.pickActivity();
                this.onPhone = false;
                this.phonePartner = null;
                this.chatBubbleTimer = 0;
                this.chatMessage = '';
                this.bubbleEl = null;
                // Chat bubble (CSS2D)
                this.bubbleEl = document.createElement('div');
                this.bubbleEl.className = 'chat-bubble';
                this.bubbleEl.style.cssText = `
                    background: rgba(20,30,50,0.9);
                    backdrop-filter: blur(6px);
                    border: 1px solid rgba(255,255,255,0.08);
                    border-radius: 12px;
                    padding: 3px 10px;
                    font-size: 10px;
                    color: #d6e3f0;
                    white-space: nowrap;
                    max-width: 120px;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
                    pointer-events: none;
                    font-family: 'Segoe UI', system-ui, sans-serif;
                    text-align: center;
                    display: none;
                `;
                this.bubbleObject = new CSS2DObject(this.bubbleEl);
                this.bubbleObject.position.set(0, 0.7, 0);
                this.group.add(this.bubbleObject);
            }

            updatePosition() {
                this.group.position.set(this.x, 0, this.z);
                this.group.rotation.y = this.angle;
            }

            pickTarget() {
                let tx = this.zone.x + 1 + Math.random() * (this.zone.w - 2);
                let tz = this.zone.z + 1 + Math.random() * (this.zone.h - 2);
                return { x: tx, z: tz };
            }

            pickActivity() {
                const activities = ['walking', 'standing', 'working', 'shopping', 'relaxing'];
                if (this.zone.type === 'farm') return 'farming';
                if (this.zone.type === 'forest') return 'hunting';
                if (this.zone.type === 'beach') return 'fishing';
                if (this.zone.type === 'downtown') return Math.random() > 0.5 ? 'working' : 'shopping';
                if (this.zone.type === 'suburban') return Math.random() > 0.6 ? 'relaxing' : 'walking';
                if (this.zone.type === 'harbor') return 'working';
                if (this.zone.type === 'town') return Math.random() > 0.5 ? 'working' : 'relaxing';
                return choose(activities);
            }

            update(dt) {
                this.stateTimer += dt;
                if (this.stateTimer > this.walkTimer + Math.random() * 2) {
                    this.stateTimer = 0;
                    this.walkTimer = 2 + Math.random() * 4;
                    if (Math.random() > 0.3) {
                        this.state = 'walking';
                        this.target = this.pickTarget();
                    } else {
                        this.state = 'standing';
                    }
                }

                // Chat/phone interaction
                if (this.chatBubbleTimer > 0) {
                    this.chatBubbleTimer -= dt;
                    if (this.chatBubbleTimer <= 0) {
                        this.bubbleEl.style.display = 'none';
                        this.chatMessage = '';
                        this.onPhone = false;
                        this.phonePartner = null;
                    }
                }

                // Try to chat or call someone
                if (Math.random() < 0.002 * dt * 60) { // small chance per frame
                    this.initiateChat();
                }

                if (this.state === 'walking') {
                    const dx = this.target.x - this.x;
                    const dz = this.target.z - this.z;
                    const d = Math.hypot(dx, dz);
                    if (d < 0.3) {
                        this.target = this.pickTarget();
                    } else {
                        const step = this.speed * dt;
                        const ratio = Math.min(step / d, 1);
                        this.x += dx * ratio;
                        this.z += dz * ratio;
                        this.angle = Math.atan2(dx, dz);
                    }
                }
                this.updatePosition();
            }

            initiateChat() {
                // Try to find a nearby person or call someone remotely
                const nearby = people.filter(p => p !== this && !p.onPhone && dist(p, this) < 3);
                if (nearby.length > 0 && Math.random() > 0.4) {
                    // Face-to-face chat
                    const partner = choose(nearby);
                    this.startChat(partner, false);
                } else if (Math.random() > 0.5) {
                    // Phone call: pick a random person anywhere
                    const candidates = people.filter(p => p !== this && !p.onPhone);
                    if (candidates.length > 0) {
                        const partner = choose(candidates);
                        this.startChat(partner, true);
                    }
                }
            }

            startChat(partner, isPhone) {
                this.onPhone = isPhone;
                this.phonePartner = partner;
                partner.onPhone = isPhone;
                partner.phonePartner = this;
                const msg = generateChatMessage();
                this.chatMessage = msg;
                partner.chatMessage = msg;
                this.bubbleEl.textContent = isPhone ? `📞 ${msg}` : msg;
                partner.bubbleEl.textContent = isPhone ? `📞 ${msg}` : msg;
                this.bubbleEl.style.display = 'block';
                partner.bubbleEl.style.display = 'block';
                this.chatBubbleTimer = 3 + Math.random() * 2;
                partner.chatBubbleTimer = this.chatBubbleTimer;
                // Log to chat log
                const speaker = `Person ${people.indexOf(this)+1}`;
                const partnerName = `Person ${people.indexOf(partner)+1}`;
                const logMsg = isPhone ? `📞 ${speaker} calling ${partnerName}: ${msg}` : `${speaker} to ${partnerName}: ${msg}`;
                addChatMessage(speaker, msg, isPhone);
            }

            dispose() {
                scene.remove(this.group);
            }
        }

        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.z - b.z);
        }

        function choose(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // ── Chat message generator ──
        const CHAT_PHRASES = [
            'Hello!', 'How are you?', 'Nice weather.', 'What\'s up?', 'Good to see you.',
            'Busy day?', 'Let\'s grab coffee.', 'Did you see the game?', 'That\'s crazy!',
            'I agree.', 'No way!', 'Awesome!', 'Take care.', 'See you later.',
            'What\'s new?', 'Working hard?', 'Weekend plans?', 'I\'m tired.',
            'Let\'s hang out.', 'Good luck!', 'Thanks!', 'You\'re welcome.',
            'That\'s funny.', 'I\'m hungry.', 'Where to go?', 'Let\'s do it.',
            'Sounds good.', 'I\'m busy.', 'Talk soon.', 'Bye!'
        ];

        function generateChatMessage() {
            return choose(CHAT_PHRASES);
        }

        // ── Car class ──
        class Car {
            constructor() {
                this.w = 0.8;
                this.h = 0.35;
                this.l = 1.4;
                this.speed = 1 + Math.random() * 2;
                this.maxSpeed = 3 + Math.random() * 2;
                this.color = new THREE.Color().setHSL(Math.random(), 0.5, 0.4);
                this.direction = Math.random() * Math.PI * 2;
                const zone = choose(zoneData.filter(z => z.type === 'downtown' || z.type === 'suburban'));
                this.x = zone.x + Math.random() * zone.w;
                this.z = zone.z + Math.random() * zone.h;
                this.group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.5, metalness: 0.3 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(this.w, this.h, this.l), bodyMat);
                body.position.y = 0.2;
                body.castShadow = true;
                this.group.add(body);
                const cabinMat = new THREE.MeshStandardMaterial({ color: 0x88bbdd, roughness: 0.1, metalness: 0.1,
                    transparent: true, opacity: 0.4 });
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(this.w * 0.7, 0.2, this.l * 0.5), cabinMat);
                cabin.position.set(0, 0.4, -this.l * 0.05);
                this.group.add(cabin);
                scene.add(this.group);
                this.updatePosition();
                this.target = this.pickTarget();
            }

            updatePosition() {
                this.group.position.set(this.x, 0, this.z);
                this.group.rotation.y = this.direction;
            }

            pickTarget() {
                const zone = choose(zoneData.filter(z => z.type === 'downtown' || z.type === 'suburban'));
                return { x: zone.x + Math.random() * zone.w, z: zone.z + Math.random() * zone.h };
            }

            update(dt) {
                const dx = this.target.x - this.x;
                const dz = this.target.z - this.z;
                const d = Math.hypot(dx, dz);
                if (d < 0.5) {
                    this.target = this.pickTarget();
                    return;
                }
                const angle = Math.atan2(dx, dz);
                let diff = angle - this.direction;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                const turnSpeed = 2.0;
                if (diff > 0.05) this.direction += Math.min(diff, turnSpeed * dt);
                else if (diff < -0.05) this.direction += Math.max(diff, -turnSpeed * dt);
                const targetSpeed = Math.min(this.maxSpeed, d / 0.5);
                this.speed += (targetSpeed - this.speed) * 0.05;
                this.speed = clamp(this.speed, 0.3, this.maxSpeed);
                const step = this.speed * dt;
                const ratio = Math.min(step / d, 1);
                this.x += dx * ratio;
                this.z += dz * ratio;
                this.updatePosition();
            }

            dispose() {
                scene.remove(this.group);
            }
        }

        // ── Boat class ──
        class Boat {
            constructor() {
                this.x = -80 + Math.random() * 80;
                this.z = 140 + Math.random() * 40;
                this.speed = 0.5 + Math.random() * 0.8;
                this.direction = Math.random() * Math.PI * 2;
                this.group = new THREE.Group();
                const hullMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, roughness: 0.7 });
                const hull = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 1.8), hullMat);
                hull.position.y = 0.1;
                this.group.add(hull);
                const cabinMat = new THREE.MeshStandardMaterial({ color: 0xccaa88, roughness: 0.6 });
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.4), cabinMat);
                cabin.position.set(0, 0.3, 0.2);
                this.group.add(cabin);
                scene.add(this.group);
                this.updatePosition();
                this.target = this.pickTarget();
            }

            updatePosition() {
                this.group.position.set(this.x, 0.05, this.z);
                this.group.rotation.y = this.direction;
            }

            pickTarget() {
                return { x: -80 + Math.random() * 80, z: 140 + Math.random() * 40 };
            }

            update(dt) {
                const dx = this.target.x - this.x;
                const dz = this.target.z - this.z;
                const d = Math.hypot(dx, dz);
                if (d < 1) {
                    this.target = this.pickTarget();
                    return;
                }
                const angle = Math.atan2(dx, dz);
                let diff = angle - this.direction;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                this.direction += diff * 0.02;
                const step = this.speed * dt;
                const ratio = Math.min(step / d, 1);
                this.x += dx * ratio;
                this.z += dz * ratio;
                this.updatePosition();
            }

            dispose() {
                scene.remove(this.group);
            }
        }

        // ── Plane class ──
        class Plane {
            constructor() {
                this.x = 160 + Math.random() * 40;
                this.z = -20 + Math.random() * 20;
                this.altitude = 15 + Math.random() * 25;
                this.speed = 4 + Math.random() * 4;
                this.direction = Math.random() * Math.PI * 2;
                this.group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.1 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 1.8), bodyMat);
                body.position.y = 0.1;
                this.group.add(body);
                const wingMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3 });
                const wing = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.3), wingMat);
                wing.position.set(0, 0.1, 0);
                this.group.add(wing);
                const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.2), wingMat);
                tail.position.set(0, 0.3, -0.8);
                this.group.add(tail);
                scene.add(this.group);
                this.updatePosition();
                this.target = this.pickTarget();
            }

            updatePosition() {
                this.group.position.set(this.x, this.altitude, this.z);
                this.group.rotation.y = this.direction;
                this.group.rotation.x = -0.1;
            }

            pickTarget() {
                return {
                    x: -80 + Math.random() * 250,
                    z: -80 + Math.random() * 250,
                    alt: 15 + Math.random() * 30
                };
            }

            update(dt) {
                const dx = this.target.x - this.x;
                const dz = this.target.z - this.z;
                const d = Math.hypot(dx, dz);
                if (d < 3) {
                    this.target = this.pickTarget();
                    return;
                }
                const angle = Math.atan2(dx, dz);
                let diff = angle - this.direction;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                this.direction += diff * 0.01;
                const step = this.speed * dt;
                const ratio = Math.min(step / d, 1);
                this.x += dx * ratio;
                this.z += dz * ratio;
                const da = this.target.alt - this.altitude;
                this.altitude += da * 0.02;
                this.updatePosition();
            }

            dispose() {
                scene.remove(this.group);
            }
        }

        // ── Spawn agents ──
        function spawnAgents() {
            const landZones = zoneData.filter(z => z.type !== 'ocean' && z.type !== 'lake');
            for (const zone of landZones) {
                const count = zone.type === 'downtown' ? 10 :
                    zone.type === 'suburban' ? 5 :
                    zone.type === 'town' ? 4 :
                    zone.type === 'countryside' ? 3 : 2;
                for (let i = 0; i < count; i++) {
                    if (people.length < 250) {
                        const p = new Person(zone);
                        people.push(p);
                    }
                }
            }
            for (let i = 0; i < 30; i++) {
                if (cars.length < 35) {
                    const c = new Car();
                    cars.push(c);
                }
            }
            for (let i = 0; i < 10; i++) {
                if (boats.length < 12) {
                    const b = new Boat();
                    boats.push(b);
                }
            }
            for (let i = 0; i < 6; i++) {
                if (planes.length < 8) {
                    const p = new Plane();
                    planes.push(p);
                }
            }
        }

        // ── Weather system ──
        let weatherState = 'clear';
        let weatherTimer = 0;

        function updateWeather(dt) {
            weatherTimer += dt;
            if (weatherTimer > 40 + Math.random() * 70) {
                weatherTimer = 0;
                const states = ['clear', 'cloudy', 'rain', 'storm'];
                weatherState = states[Math.floor(Math.random() * states.length)];
                if (weatherState === 'clear') {
                    scene.background.setHex(0x87CEEB);
                    sunLight.intensity = 1.8;
                    ambientLight.intensity = 0.5;
                } else if (weatherState === 'cloudy') {
                    scene.background.setHex(0x8899aa);
                    sunLight.intensity = 0.8;
                    ambientLight.intensity = 0.7;
                } else if (weatherState === 'rain') {
                    scene.background.setHex(0x667788);
                    sunLight.intensity = 0.4;
                    ambientLight.intensity = 0.6;
                } else if (weatherState === 'storm') {
                    scene.background.setHex(0x445566);
                    sunLight.intensity = 0.2;
                    ambientLight.intensity = 0.5;
                }
                weatherDisplay.textContent = weatherState === 'clear' ? '☀️ Clear' :
                    weatherState === 'cloudy' ? '☁️ Cloudy' :
                    weatherState === 'rain' ? '🌧️ Rain' : '⛈️ Storm';
            }
        }

        // ── Date/Time ──
        let simDay = 1,
            simHour = 8,
            simMinute = 0;
        let timeAccum = 0;

        function updateDateTime(dt) {
            timeAccum += dt;
            if (timeAccum > 1.0 / 60) {
                timeAccum = 0;
                simMinute += 1;
                if (simMinute >= 60) { simMinute = 0;
                    simHour += 1; if (simHour >= 24) { simHour = 0;
                        simDay += 1; } }
            }
            const hourAngle = (simHour + simMinute / 60) / 24 * Math.PI * 2;
            const sunRadius = 120;
            const sunX = Math.cos(hourAngle) * sunRadius;
            const sunZ = Math.sin(hourAngle) * sunRadius;
            sunLight.position.set(sunX, Math.sin(hourAngle) * 50 + 30, sunZ);
            const dayFactor = Math.max(0, Math.sin(hourAngle));
            sunLight.intensity = 1.0 + dayFactor * 1.0;
            ambientLight.intensity = 0.3 + dayFactor * 0.4;
            scene.background.setHex(new THREE.Color().setHSL(0.6, 0.5, 0.4 + dayFactor * 0.4));
            datetimeDisplay.textContent = `Day ${simDay}, ${String(simHour).padStart(2,'0')}:${String(simMinute).padStart(2,'0')}`;
        }

        // ── Crime overlay ──
        function updateCrimeOverlay() {
            let html = '';
            for (const zone of zoneData) {
                const rate = crimeRates[zone.name] || 0.05;
                const pct = (rate * 100).toFixed(1);
                const color = rate < 0.15 ? '#22aa44' : rate < 0.35 ? '#ffaa33' : '#dd3333';
                html += `<div class="zone"><span>${zone.name}</span><span class="rate" style="color:${color}">${pct}%</span></div>`;
            }
            crimeList.innerHTML = html;
        }

        function toggleCrimeOverlay() {
            crimeOverlay.classList.toggle('visible');
            if (crimeOverlay.classList.contains('visible')) updateCrimeOverlay();
        }

        // ── Reset ──
        function resetSimulation() {
            for (const p of people) p.dispose();
            for (const c of cars) c.dispose();
            for (const b of boats) b.dispose();
            for (const p of planes) p.dispose();
            people = [];
            cars = [];
            boats = [];
            planes = [];
            simDay = 1;
            simHour = 8;
            simMinute = 0;
            timeAccum = 0;
            chatMessages.length = 0;
            renderChatLog();
            spawnAgents();
            statusText.textContent = '🔄 reset';
            setTimeout(() => { statusText.textContent = 'AI alive'; }, 800);
        }

        // ── Update loop ──
        let speedFactor = 1.0;
        let isPlaying = true;
        let lastTimestamp = 0;

        function update(dt) {
            const dts = dt * speedFactor;
            if (!isPlaying) return;

            for (const p of people) p.update(dts);
            for (const c of cars) c.update(dts);
            for (const b of boats) b.update(dts);
            for (const p of planes) p.update(dts);

            updateWeather(dts);
            updateDateTime(dts);

            peopleCountEl.textContent = people.length;
            carCountEl.textContent = cars.length;
            boatCountEl.textContent = boats.length;
            planeCountEl.textContent = planes.length;

            if (people.length < 100) spawnAgents();
        }

        // ── Animation loop ──
        function animate(timestamp) {
            if (lastTimestamp === 0) lastTimestamp = timestamp;
            let dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            dt = Math.min(dt, 0.05);

            updateCameraMovement(dt);
            update(dt);

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ── Window resize ──
        function resize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        // ── Controls ──
        speedSlider.addEventListener('input', () => {
            const val = parseInt(speedSlider.value, 10);
            speedFactor = val / 100;
            speedValue.textContent = speedFactor.toFixed(1) + '×';
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '<span style="font-size:14px;">⏸</span> Pause' :
                '<span style="font-size:14px;">▶</span> Play';
            if (isPlaying) lastTimestamp = 0;
            statusText.textContent = isPlaying ? 'AI alive' : 'paused';
        });

        resetBtn.addEventListener('click', resetSimulation);
        crimeToggleBtn.addEventListener('click', toggleCrimeOverlay);
        chatToggleBtn.addEventListener('click', toggleChatLog);

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') { e.preventDefault();
                playBtn.click(); }
            if (e.key === 'r' || e.key === 'R') resetBtn.click();
        });

        // ── Init ──
        spawnAgents();
        weatherState = 'clear';
        weatherDisplay.textContent = '☀️ Clear';
        animate(0);

        console.log('🌍 Realistic World with chat, phones, and landscape — WASD to move, C for crime, L for chat log.');
    </script>
</body>
</html>
